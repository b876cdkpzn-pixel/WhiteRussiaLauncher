
name: White Russia APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        shell: bash
        run: |
          PROJECT=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found. Upload and extract project files first."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRussia-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
